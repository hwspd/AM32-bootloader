# OpenOCD configuration for a 64 KiB GD32F350x8 and a CMSIS-DAP probe.
source [find interface/cmsis-dap.cfg]
transport select swd

source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

set _CHIPNAME gd32f3x0
set _TARGETNAME $_CHIPNAME.cpu
set _WORKAREASIZE 0x1000
set _FLASH_SIZE 0x10000

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf \
    -expected-id 0x2ba01477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian little -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 \
    -work-area-size $_WORKAREASIZE -work-area-backup 0 \
    -gdb-max-connections 4

# OpenOCD's stm32f1x flash driver supports the GD32F3x0 FMC programming model.
flash bank $_CHIPNAME.flash stm32f1x 0x08000000 $_FLASH_SIZE 0 0 $_TARGETNAME

adapter speed 1000
reset_config srst_nogate
cortex_m reset_config sysresetreq
init
